<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faulty Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            background-color: red;
        }
    </style>
</head>

<body>
    <h1>Faulty Calculator</h1>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number"><br>

    <button onclick="calculate('add')">Add</button>
    <button onclick="calculate('subtract')">Subtract</button>
    <button onclick="calculate('multiply')">Multiply</button>
    <button onclick="calculate('divide')">Divide</button>

    <h2>Result: <span id="result"></span></h2>

    <script>
        function calculate(operation) {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);

            if (isNaN(num1) || isNaN(num2)) {
                alert("Please enter valid numbers.");
                return;
            }

            // Generate a random number to decide if the operation will be faulty (10% chance)
            const random = Math.random();
            let result;

            // If random number is less than 0.1 (10% chance), perform a wrong operation
            if (random < 0.1) {
                switch (operation) {
                    case 'add':
                        result = num1 * num2; // Wrong operation
                        break;
                    case 'subtract':
                        result = num1 + num2; // Wrong operation
                        break;
                    case 'multiply':
                        result = num1 / num2; // Wrong operation
                        break;
                    case 'divide':
                        result = num1 - num2; // Wrong operation
                        break;
                }
                alert("Oops! The calculator malfunctioned!");
            } else {
                // Perform correct operation
                switch (operation) {
                    case 'add':
                        result = num1 + num2;
                        break;
                    case 'subtract':
                        result = num1 - num2;
                        break;
                    case 'multiply':
                        result = num1 * num2;
                        break;
                    case 'divide':
                        if (num2 === 0) {
                            alert("Cannot divide by zero.");
                            return;
                        }
                        result = num1 / num2;
                        break;
                }
            }

            // Display result
            document.getElementById('result').innerText = result;
        }
    </script>
</body>

</html>
