<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css transformation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            height: 30vh;
            width: 80vw;
            border: 2px solid blueviolet;
        }

        .box {
            height: 30px;
            width: 30px;
            background-color: aqua;
            border: 2px solid black;
            transform: translateY(70%) skew(40deg) translateX(40%);
            justify-content: center;
            align-items: center;
            align-content: center;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            box
        </div>
    </div>
</body>

</html>
