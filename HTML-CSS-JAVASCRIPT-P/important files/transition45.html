<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition property</title>
    <style>
        .conteiner {
            height: 50vh;
            width: 40vw;
            border: 2px solid red;
            background-color: rgb(240, 255, 246);
        }

        .items {
            width: 40px;
            height: 20px;
            background-color: aqua;
            transition-property: all;
            transition-duration: 3s;
            transition-timing-function: ease-in-out;
            transition-delay: 1s;

        }

        .transform {
            transform: translateX(10vw) translateY(10vh);
            background-color: crimson;
        }
    </style>
</head>

<body>
    <div class="conteiner">
        <div class="items transform"></div>
    </div>
</body>

</html>
