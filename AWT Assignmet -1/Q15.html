<!DOCTYPE html>
<html>

<head>

    <title>Embedded Stylesheet</title>

    <style>
        h1 {
            font-family: "Times New Roman";

        }

        p {
            font-size: 18px;
            font-weight: bold;
            color: red;

            font-style: italic;
        }
    </style>

</head>

<body>

    <h1>
        This is a sentence using embedded stylesheet.
    </h1>
    <p>
        This is a sentence using embedded stylesheet.
    </p>

</body>

</html>
