<html>

<head>

    <title>Class Selector</title>

    <style>
        .std {
            color: red;
            font-size: 20px;
            font-weight: bold;
        }

        .two {
            color: black;
            background-color: red;
            font-size: 40px;
            font-weight: bold;

        }
    </style>

</head>

<body>

    <p class="std">
        this is the first paragraph
    </p>
    <p class="two">
        this is the second paragraph
    </p>



</body>

</html>
