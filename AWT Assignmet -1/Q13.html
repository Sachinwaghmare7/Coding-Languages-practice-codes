<html>

<head>
    <title>HTML5 Controls</title>
</head>

<body>

    <h2>HTML5 Form Controls</h2>

    <form>
        Name:<input type="text" name="name"><br><br>
        Email:<input type="email" name="email"><br><br>
        Password:<input type="password" name="password"> <br><br>
        Mobile:<input type="tel" name="mobile"><br><br>
        Website:<input type="url" name="website"><br><br>
        Date:<input type="date" name="date"><br><br>
        Time:<input type="time" name="time"><br><br>
        Date and Time: <input type="datetime-local" name="datetime"><br><br>
        Month: <input type="month" name="month"> <br><br>

        Week: <input type="week" name="week"> <br><br>

        Age: <input type="number" name="age"> <br><br>

        Range: <input type="range" name="range"> <br><br>

        Search: <input type="search" name="search"> <br><br>

        Favorite Color: <input type="color" name="color"> <br><br>

        <input type="submit" value="Submit">



    </form>

</body>

</html>
