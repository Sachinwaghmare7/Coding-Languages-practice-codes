<html>

<head>
    <title>CSS Fonts</title>
    <style>
        /* -------------- CSS Fonts --------------- */

        /* 1*/
        p {
            font-family: "Times New Roman";
        }

        /* 2 */
        h1 {
            font-size: 20px;
        }
    </style>
</head>

<body>
    <h1>CSS Fonts</h1>
    <p>This text uses Times New Roman font.</p>
    <h1>This text has font size.</h1>
</body>

</html>
