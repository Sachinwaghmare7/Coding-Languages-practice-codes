<html>

<head>
    <title>CSS Lists</title>
    <style>
        /* -------------- CSS Lists --------------  */

        /* 1 */
        .square {
            list-style-type: square;
        }

        /* 2 */
        .circle {
            list-style-type: circle;
        }

        /* 3 */
        .roman {
            list-style-type: upper-roman;
        }

        /* 4 */
        .image {
            list-style-image: url("bullet.png");
        }
    </style>
</head>

<body>
    <h2>CSS Lists</h2>

    <ul class="square">
        <li>Apple</li>
        <li>Mango</li>
    </ul>

    <ul class="circle">
        <li>Java</li>
        <li>Python</li>
    </ul>

    <ol class="roman">
        <li>HTML</li>
        <li>CSS</li>
    </ol>

    <ul class="image">
        <li>Red</li>
        <li>Blue</li>
    </ul>
</body>

</html>
