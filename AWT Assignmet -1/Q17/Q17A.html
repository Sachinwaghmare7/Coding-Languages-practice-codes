<html>

<head>
    <title>CSS Selectors</title>
    <style>
        /* --------- CSS Selectors ------------ */
        /* 1. Element Selector */
        p {
            color: red;
        }

        /* 2 */
        .myclass {
            color: blue;
            font-size: 20px;
        }

        /* 3 */
        p.myclass {
            color: green;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <p>Element Selector</p>
    <h3 class="myclass">Class Selector</h3>
    <p class="myclass">Paragraph Class Selector</p>
</body>

</html>
