<html>

<head>
    <title>CSS Links</title>
    <style>
        /* ----------------  CSS Links ---------------- */

        /* 1 */
        a:link {
            color: blue;
        }

        a:visited {
            color: purple;
        }

        /* 2 */
        a {
            text-decoration: none;
        }

        /* 3 */
        a {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <h1>CSS Links</h1>
    <a href="https://www.google.com">Google</a><br><br>
    <a href="https://www.youtube.com">YouTube</a>
</body>

</html>
