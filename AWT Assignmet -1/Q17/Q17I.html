<!DOCTYPE html>
<html>

<head>
    <title>CSS Margin</title>
    <style>
        /* ------------ CSS Margin -------------- */

        /* 1 */
        .one {
            margin-top: 20px;
            margin-right: 30px;
            margin-bottom: 20px;
            margin-left: 30px;
        }

        /* 2 */
        .two {
            margin: 20px 30px 20px 30px;
        }

        /* 3 */
        .three {
            margin-bottom: 5%;
        }
    </style>
</head>

<body>
    <h2>CSS Margin</h2>

    <p class="one">Specify Margins</p>
    <p class="two">Margin Shorthand</p>
    <p class="three">Bottom Margin Percentage</p>
</body>

</html>
