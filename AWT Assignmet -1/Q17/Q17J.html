<!DOCTYPE html>
<html>

<head>
    <title>CSS Padding</title>
    <style>
        /* -----------------CSS Padding----------- */

        /* 1 */
        .one {
            padding-left: 20px;
        }

        /* 2 */
        .two {
            padding-right: 20px;
        }

        /* 3 */
        .three {
            padding-top: 20px;
        }

        /* 4 */
        .four {
            padding-bottom: 20px;
        }
    </style>
</head>

<body>
    <h2>CSS Padding</h2>

    <p class="one">Left Padding</p>
    <p class="two">Right Padding</p>
    <p class="three">Top Padding</p>
    <p class="four">Bottom Padding</p>
</body>

</html>
