<html>

<head>
    <title>CSS Tables</title>
    <style>
        /* -------------- CSS Tables ------------- */

        /* 1 */
        table,
        th,
        td {
            border: 1px solid black;
        }

        /* 2 */
        table {
            width: 500px;
            height: 200px;
        }

        /* 3 */
        td {
            text-align: center;
        }

        /* 4 */
        td {
            vertical-align: middle;
        }

        /* 5 */
        th,
        td {
            padding: 10px;
        }

        /* 6 */
        table,
        th,
        td {
            border: 1px solid red;
        }
    </style>
</head>

<body>
    <h2>CSS Tables</h2>
    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
        </tr>
        <tr>
            <td>Sachin</td>
            <td>BCA</td>
        </tr>
        <tr>
            <td>Rahul</td>
            <td>BSc</td>
        </tr>
    </table>
</body>

</html>
