<html>

<head>
    <title>CSS Backgrounds</title>
    <style>
        /* ---------------CSS Backgrounds -------- */
        /* ----------using comments apply one by one styling------ */

        /* 1 */
        body {
            background-color: yellow;
        }

        /* 2*/
        p {
            background-color: lightblue;
        }

        h1 {
            background-color: yellow;
        }

        /* 3 */
        body {
            background-image: url("background.jpg");
        }
    </style>
</head>

<body>
    <h1>CSS Backgrounds</h1>
    <p>Background color of paragraph.</p>
</body>

</html>
