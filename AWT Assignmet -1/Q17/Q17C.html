<html>

<head>
    <title>CSS Text</title>
    <style>
        /* ----------------  CSS Text ----------------------- */

        /* ------------- using comments apply one by one---------- */
        /* 1 */
        p {
            color: red;
        }

        /* 2 */
        h1 {
            text-align: center;
        }

        /* 3 */
        a {
            text-decoration: none;
        }

        /* 4 */
        .underline {
            text-decoration: underline;
        }

        /* 5 */
        .strike {
            text-decoration: line-through;
        }

        /* 6 */
        .upper {
            text-transform: uppercase;
        }

        /* 7 */
        .lower {
            text-transform: lowercase;
        }

        /* 8 */
        .capital {
            text-transform: capitalize;
        }

        /* 9 */
        .letter {
            letter-spacing: 5px;
        }

        /* 10 */
        .line {
            line-height: 2;
        }
    </style>
</head>

<body>
    <h1>CSS Text Properties</h1>
    <p>Text color red.</p>
    <a href="#">Click Here</a>
    <p class="underline">Underlined Text</p>
    <p class="strike">Strikethrough Text</p>
    <p class="upper">hello world</p>
    <p class="lower">HELLO WORLD</p>
    <p class="capital">hello world</p>
    <p class="letter">Letter Spacing</p>
    <p class="line">CSS text properties<br>Control line spacing.</p>
</body>

</html>
