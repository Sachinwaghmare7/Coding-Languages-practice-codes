<html>

<head>
    <title>Feedback Form</title>
</head>

<body>

    <h2>Feedback Form</h2>

    <form>

        Name: <input type="text" name="name" placeholder="Enter name"><br><br>
        Email:<input type="email" name="email" placeholder="Enter password"><br><br>
        Service rating?<br>

        <input type="radio" name="service" value="excellent">Excellent
        <input type="radio" name="service" value="good"> Good
        <input type="radio" name="service" value="average">Average
        <br><br>
        Feedback:<br>
        <textarea name="feedback" rows="5" cols="40"></textarea>
        <br>

        <input type="submit" value="Submit Feedback">

    </form>

</body>

</html>
